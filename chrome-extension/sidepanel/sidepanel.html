<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Toolbox - Side Panel</title>
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/icons.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- SVG Icon Sprite -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5a3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97c0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1c0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"
        />
      </symbol>
      <symbol id="icon-magic" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="m19 9 1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9m-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5M19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15Z"
        />
      </symbol>
      <symbol id="icon-add" viewBox="0 0 24 24">
        <path fill="currentColor" d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z"
        />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-5-5m-6 0A4.5 4.5 0 1 1 14 9.5A4.5 4.5 0 0 1 9.5 14Z"
        />
      </symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M20.71 7.04c.39-.39.39-1.04 0-1.41l-2.34-2.34c-.37-.39-1.02-.39-1.41 0l-1.84 1.83 3.75 3.75M3 17.25V21h3.75L17.81 9.93l-3.75-3.75L3 17.25Z"
        />
      </symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1m3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2m0 16H8V7h11v14Z"
        />
      </symbol>
      <symbol id="icon-export" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"
        />
      </symbol>
      <symbol id="icon-delete" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12M19 4h-3.5l-1-1h-5l-1 1H5v2h14V4Z"
        />
      </symbol>
      <symbol id="icon-expand" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          d="M7 14H5v5h5v-2H7v-3m-2-4h2V7h3V5H5v5m12 7h-3v2h5v-5h-2v3M14 5v2h3v3h2V5h-5Z"
        />
      </symbol>
    </svg>

    <div class="sidepanel-container">
      <!-- Navigation -->
      <nav class="nav-tabs">
        <button class="nav-tab active" data-section="templates">
          Templates
        </button>
        <button class="nav-tab" data-section="workflows">Workflows</button>
        <button class="nav-tab" data-section="history">History</button>
      </nav>

      <!-- Open template/workflow editor tabs, one row below the main nav -->
      <nav class="editor-tabs-row hidden" id="editorTabsRow"></nav>

      <!-- Main Content -->
      <main class="sidepanel-content">
        <!-- Templates Section -->
        <section id="templates" class="section active">
          <div class="section-header">
            <button class="btn btn-primary btn-small" id="createTemplateBtn">
              <svg class="icon icon--sm"><use href="#icon-add"></use></svg>New Template
            </button>
            <div class="search-box">
              <svg class="icon icon--sm search-box-icon"><use href="#icon-search"></use></svg>
              <input
                type="text"
                id="templateSearch"
                class="form-input"
                placeholder="Search templates..."
              />
            </div>
          </div>

          <div id="templatesList" class="templates-list">
            <!-- Template cards will be rendered here -->
          </div>

          <div id="templatesEmpty" class="empty-state hidden">
            <h3>No templates found</h3>
            <p>Create your first template to get started</p>
          </div>
        </section>

        <!-- Workflows Section -->
        <section id="workflows" class="section">
          <div class="section-header">
            <button class="btn btn-primary btn-small" id="createWorkflowBtn">
              <svg class="icon icon--sm"><use href="#icon-add"></use></svg>New Workflow
            </button>
            <div class="search-box">
              <svg class="icon icon--sm search-box-icon"><use href="#icon-search"></use></svg>
              <input
                type="text"
                id="workflowSearch"
                class="form-input"
                placeholder="Search workflows..."
              />
            </div>
          </div>

          <div id="workflowsList" class="workflows-list">
            <!-- Workflow cards will be rendered here -->
          </div>

          <div id="workflowsEmpty" class="empty-state hidden">
            <h3>No workflows found</h3>
            <p>Chain prompts and tool-using agents into one repeatable run</p>
          </div>
        </section>

        <!-- History Section -->
        <section id="history" class="section">
          <div class="section-header">
            <button class="btn btn-secondary btn-small" id="clearHistoryBtn">
              Clear All
            </button>
            <div class="search-box">
              <svg class="icon icon--sm search-box-icon"><use href="#icon-search"></use></svg>
              <input
                type="text"
                id="historySearch"
                class="form-input"
                placeholder="Search history..."
              />
            </div>
          </div>

          <div id="historyList" class="history-list">
            <!-- History entries will be rendered here -->
          </div>

          <div id="historyEmpty" class="empty-state hidden">
            <h3>No history found</h3>
            <p>Execute templates to see your history here</p>
          </div>
        </section>
      </main>

      <!-- Footer -->
      <footer class="sidepanel-footer">
        <div class="footer-content">
          <div class="footer-spacer"></div>
          <button
            class="footer-btn footer-btn-right"
            id="expandBtn"
            title="Open in full screen"
          >
            <svg class="icon icon--md"><use href="#icon-expand"></use></svg>
          </button>
          <button
            class="footer-btn footer-btn-right"
            id="settingsBtn"
            title="Settings"
          >
            <svg class="icon icon--md icon-settings"><use href="#icon-settings"></use></svg>
          </button>
        </div>
      </footer>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script type="module" src="../shared/components/toast.js"></script>
    <script type="module" src="../shared/components/modal.js"></script>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
