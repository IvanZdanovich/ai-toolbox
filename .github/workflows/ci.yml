name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      # The e2e flows drive the shipped UI in a real Chrome, which Vitest's
      # jsdom run cannot host, so they are their own step.
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:e2e
